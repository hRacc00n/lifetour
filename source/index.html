<!DOCTYPE html>
<html lang="ru" data-validate="html">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifetour</title>
    <link rel="stylesheet" href="sass/style.scss">
  </head>

  <body class="page-body">
    <!-- пример использования спрайта -->
    <!-- <img src="/__spritemap#sprite-logo-view" alt="Это спрайт">
    <svg>
      <use href="/__spritemap#sprite-user"></use>
    </svg> -->
    <!-- примеры требуемых атрибутов data-test="*" -->

    <header class="header" data-test="header">
      <div class="header__container">

        <button class="header__button toggle-burger" type="button">
          <span class="visually-hidden">Открыть меню</span>
          <span class="toggle-burger__line1"></span>
          <span class="toggle-burger__line2"></span>
          <span class="toggle-burger__line3"></span>
        </button>

        <a class="header__logo" href="#">
          <span class="visually-hidden">Логотип сайта LifeTour</span>
          <svg width="142" height="42">
            <use href="/__spritemap#sprite-logo"></use>
          </svg>
        </a>

        <a class="header__phone" href="tel:88000000000">8 800 000-00-00</a>

        <nav class="header__navigation header__navigation--close">
          <ul class="header__list">
            <li class="header__item">
              <a class="header__link" href="#">Туры</a>
            </li>

            <li class="header__item">
              <a class="header__link" href="#">Обучение</a>
            </li>

            <li class="header__item">
              <a class="header__link" href="#">О нас</a>
            </li>

            <li class="header__item">
              <a class="header__link" href="#">Отзывы</a>
            </li>

            <li class="header__item">
              <a class="header__link" href="#">Фотографии</a>
            </li>

            <li class="header__item">
              <a class="header__link" href="#">Контакты</a>
            </li>
          </ul>
        </nav>

      </div>
    </header>

    <div data-test="hero">hero</div>
    <div data-test="tours">tours</div>
    <div data-test="training">training</div>
    <div data-test="about">about</div>
    <div data-test="reviews">reviews</div>
    <div data-test="adv">adv</div>
    <div data-test="gallery">gallery</div>
    <div data-test="form">form</div>
    <div data-test="footer">footer</div>
    <script type="module" src="js/main.js"></script>
  </body>

</html>
